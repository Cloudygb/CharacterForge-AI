AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CharacterForge AI MVP serverless stack. Defines the API Lambda, REST API,
  API key usage plan, DynamoDB persistence tables, and least-privilege access
  to DynamoDB and Amazon Bedrock Runtime.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Short environment suffix used in resource names.
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    ConstraintDescription: Use only letters, numbers, and hyphens.

  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Bedrock model ID used by the CharacterForge runtime client.

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region where the selected Bedrock model is available.

  RecentHistoryLimit:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Maximum number of recent session messages to load for prompt context.

  AuthorizationMode:
    Type: String
    Default: cognito
    AllowedValues:
      - cognito
      - local
    Description: >
      Select cognito for deployed environments that validate bearer tokens at the edge.
      Select local for local development only; local mode is not for deployed environments.

  CognitoUserPoolArn:
    Type: String
    Default: ''
    Description: Cognito user pool ARN used by the API Gateway JWT authorizer when AuthorizationMode is cognito.

  JwtIssuer:
    Type: String
    Default: ''
    Description: Expected OIDC/Cognito issuer URL recorded for JWT-authorizer configuration and release evidence.

  JwtAudience:
    Type: String
    Default: ''
    Description: Expected JWT audience or Cognito app client ID recorded for JWT-authorizer configuration and release evidence.

Conditions:
  UseCognitoAuthorizer: !Equals [!Ref AuthorizationMode, cognito]

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        LOG_LEVEL: INFO
        ENVIRONMENT_NAME: !Ref EnvironmentName

Resources:
  CharacterForgeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub CharacterForge-${EnvironmentName}-api
      Description: REST API for CharacterForge AI MVP endpoints.
      StageName: !Ref EnvironmentName
      EndpointConfiguration: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt CharacterForgeApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","errorMessage":"$context.error.message"}'
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          MetricsEnabled: true
          LoggingLevel: ERROR
          DataTraceEnabled: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,x-api-key'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CharacterForgeJwtAuthorizer
        Authorizers:
          CharacterForgeJwtAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            Identity:
              Header: Authorization

  CharacterForgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles CharacterForge character, chat, and session API requests.
      CodeUri: ../src
      Handler: characterforge.app.handler
      Environment:
        Variables:
          CHARACTERS_TABLE_NAME: !Ref CharactersTable
          MESSAGES_TABLE_NAME: !Ref MessagesTable
          CHARACTERFORGE_BEDROCK_MODEL_ID: !Ref BedrockModelId
          CHARACTERFORGE_BEDROCK_REGION: !Ref BedrockRegion
          CHARACTERFORGE_RECENT_HISTORY_LIMIT: !Ref RecentHistoryLimit
          CHARACTERFORGE_AUTH_LOCAL_DEV_MODE: !If [UseCognitoAuthorizer, 'false', 'true']
      Policies:
        # CRUD access is scoped to the two DynamoDB tables owned by this stack.
        - DynamoDBCrudPolicy:
            TableName: !Ref CharactersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        # Bedrock model invocation is required for real character responses.
        # Foundation models do not include an account ID in their ARNs.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/*
      Events:
        CreateCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters
            Method: POST
            Auth:
              ApiKeyRequired: true
        ListCharacters:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters
            Method: GET
            Auth:
              ApiKeyRequired: true
        GetCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters/{character_id}
            Method: GET
            Auth:
              ApiKeyRequired: true
        UpdateCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters/{character_id}
            Method: PUT
            Auth:
              ApiKeyRequired: true
        DeleteCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters/{character_id}
            Method: DELETE
            Auth:
              ApiKeyRequired: true
        ChatWithCharacter:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /characters/{character_id}/chat
            Method: POST
            Auth:
              ApiKeyRequired: true
        GetSession:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /sessions/{session_id}
            Method: GET
            Auth:
              ApiKeyRequired: true
        DeleteSession:
          Type: Api
          Properties:
            RestApiId: !Ref CharacterForgeApi
            Path: /sessions/{session_id}
            Method: DELETE
            Auth:
              ApiKeyRequired: true

  CharacterForgeApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub CharacterForge-${EnvironmentName}-api-key
      Description: API key for optional usage-plan metering, throttling, and quotas only; not caller identity.
      Enabled: true

  CharacterForgeUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub CharacterForge-${EnvironmentName}-usage-plan
      Description: Usage plan for optional deployed API-key metering, throttling, and quotas.
      ApiStages:
        - ApiId: !Ref CharacterForgeApi
          Stage: !Ref EnvironmentName
      Throttle:
        BurstLimit: 20
        RateLimit: 10
      Quota:
        Limit: 10000
        Period: MONTH

  CharacterForgeUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref CharacterForgeApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref CharacterForgeUsagePlan

  CharactersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CharacterForgeCharacters-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: character_id
          AttributeType: S
      KeySchema:
        - AttributeName: character_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: CharacterForgeAI
        - Key: Environment
          Value: !Ref EnvironmentName

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CharacterForgeMessages-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: created_at_message_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: created_at_message_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: CharacterForgeAI
        - Key: Environment
          Value: !Ref EnvironmentName

  CharacterForgeApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/CharacterForge-${EnvironmentName}
      RetentionInDays: 14
      Tags:
        - Key: Application
          Value: CharacterForgeAI
        - Key: Environment
          Value: !Ref EnvironmentName

  CharacterForgeCloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub CharacterForge-${EnvironmentName}-observability
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CharacterForge Lambda Invocations and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${CharacterForgeFunction}", { "stat": "Sum", "label": "Invocations" } ],
                  [ ".", "Errors", ".", ".", { "stat": "Sum", "label": "Errors" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CharacterForge Lambda Duration",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${CharacterForgeFunction}", { "stat": "Average", "label": "Average duration" } ],
                  [ ".", ".", ".", ".", { "stat": "p95", "label": "p95 duration" } ]
                ],
                "period": 300,
                "yAxis": { "left": { "label": "Milliseconds" } }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CharacterForge API Gateway Requests and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "CharacterForge-${EnvironmentName}-api", "Stage", "${EnvironmentName}", { "stat": "Sum", "label": "Requests" } ],
                  [ ".", "4XXError", ".", ".", ".", ".", { "stat": "Sum", "label": "4XX errors" } ],
                  [ ".", "5XXError", ".", ".", ".", ".", { "stat": "Sum", "label": "5XX errors" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CharacterForge DynamoDB Throttles",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${CharactersTable}", { "stat": "Sum", "label": "Characters read throttles" } ],
                  [ ".", "WriteThrottleEvents", ".", ".", { "stat": "Sum", "label": "Characters write throttles" } ],
                  [ ".", "ReadThrottleEvents", ".", "${MessagesTable}", { "stat": "Sum", "label": "Messages read throttles" } ],
                  [ ".", "WriteThrottleEvents", ".", ".", { "stat": "Sum", "label": "Messages write throttles" } ]
                ],
                "period": 300
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 12,
              "width": 24,
              "height": 4,
              "properties": {
                "markdown": "# CharacterForge Log Links\n- Lambda logs: [/aws/lambda/${CharacterForgeFunction}](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Faws$252Flambda$252F${CharacterForgeFunction})\n- API access logs: [/aws/apigateway/CharacterForge-${EnvironmentName}](https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Faws$252Fapigateway$252FCharacterForge-${EnvironmentName})\n- REST API: ${CharacterForgeApi} in stage ${EnvironmentName}"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Base URL for the deployed CharacterForge REST API stage.
    Value: !Sub https://${CharacterForgeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}

  ApiKeyId:
    Description: API Gateway API key ID. Retrieve the key value from AWS when needed; do not commit it.
    Value: !Ref CharacterForgeApiKey

  FunctionName:
    Description: Name of the CharacterForge Lambda function.
    Value: !Ref CharacterForgeFunction

  CharactersTableName:
    Description: DynamoDB table storing character profiles.
    Value: !Ref CharactersTable

  MessagesTableName:
    Description: DynamoDB table storing session message history.
    Value: !Ref MessagesTable

  CloudWatchDashboardName:
    Description: Name of the CloudWatch dashboard for deployed CharacterForge observability.
    Value: !Ref CharacterForgeCloudWatchDashboard

  ApiAccessLogGroupName:
    Description: CloudWatch Logs group for API Gateway access logs.
    Value: !Sub /aws/apigateway/CharacterForge-${EnvironmentName}
