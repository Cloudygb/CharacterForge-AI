[package]
name = "characterforge-dashboard"
version = "0.1.0"
description = "Desktop shell for the CharacterForge AI dashboard"
authors = ["CloudyGB"]
edition = "2021"
license = "MIT"

[lib]
name = "characterforge_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
